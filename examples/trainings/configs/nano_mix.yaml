phases:
  - name: nano-512
    model:
      timestep_sampling: log_normal
      logit_mean: 0.0
      logit_std: 1.0
      prediction_type: flow_matching
      tokenizer_max_length: 256
      tokenizer_padding: "longest"
      num_layers: 5
      num_single_layers: 5
      patch_size: 1
      num_attention_heads: 24
      attention_head_dim: 128
      mlp_ratio: 2.0
      text_embedder: qwen3-4b
      use_context_rms_norm: True
      share_modulation: True
      use_adaln_learnable_embedding: True
      adaln_zero_init: True
      vae_input_key: "latent"
      conditioner_input_key: "text"
      base_resolution: [32, 32]
    datasets:
      train:
        mappers:
          - name: text_to_image
            bucket: jasperai/monet
            shards:
              - v1.1.0/synthetic
            probability: .5
            mapper_kwargs:
              dataset_name: text_to_image
              image_key: "jpg"
              text_embedding_key: null #"qwen3-4b-instruct-2507_longest_caption.pth"
              verbose: False
              captioners_names:
                - caption_original
              captioners_probabilities:
                - 1.0
            shuffle_before_split_by_node_buffer_size: 1
            shuffle_before_split_by_workers_buffer_size: 1
            shuffle_before_filter_mappers_buffer_size: 10
            shuffle_after_filter_mappers_buffer_size: 10
            num_workers: 3
            pixel_budgets: null
            budgets_probabilities: null
          - name: text_to_image
            bucket: jasperai/monet
            shards:
              - v1.1.0/cc12m
            probability: 0.1 # 10% of the time we use the cc12m dataset
            mapper_kwargs:
              dataset_name: cc12m
              image_key: "jpg"
              text_embedding_key: null #"qwen3-4b-instruct-2507_longest_caption.pth"
              verbose: False
              captioners_names:
                - caption_florence-2-large
                - caption_gemini-2.5-flash-lite
                - caption_internvl-3-8b
                - caption_sharegpt4v-7b
              captioners_probabilities:
                - 0.25
                - 0.25
                - 0.25
                - 0.25
            shuffle_before_split_by_node_buffer_size: 1
            shuffle_before_split_by_workers_buffer_size: 1
            shuffle_before_filter_mappers_buffer_size: 10
            shuffle_after_filter_mappers_buffer_size: 10
            num_workers: 3
            pixel_budgets: null
            budgets_probabilities: null
          - name: text_to_image
            bucket: jasperai/monet
            shards:
              - v1.1.0/megalith10m
            probability: 0.1 # 10% of the time we use the megalith10m dataset
            mapper_kwargs:
