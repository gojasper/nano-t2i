            shuffle_before_filter_mappers_buffer_size: 10
            shuffle_after_filter_mappers_buffer_size: 10
            num_workers: 3
            pixel_budgets: null
            budgets_probabilities: null
          - name: text_to_image
            bucket: jasperai/monet
            shards:
              - v1.1.0/laion
            probability: 0.1 # 10% of the time we use the laion dataset
            mapper_kwargs:
